# Render "Blueprint": the recipe Render reads from this repository to create the API service.
# Docs: https://render.com/docs/blueprint-spec
#
# Secrets are NOT stored here. Entries with `sync: false` are asked for once in Render's dashboard
# when the blueprint is first applied; `generateValue: true` lets Render invent a random secret
# that never leaves Render.
services:
  - type: web
    name: isabella-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt        # the nearest Render region to the Supabase database (Ireland)
    plan: free               # sleeps after 15 min idle; wakes in about a minute
    healthCheckPath: /health
    autoDeploy: true         # every push to the default branch redeploys
    envVars:
      # --- fixed settings -------------------------------------------------------------
      - key: APP_ENV
        value: production    # Secure cookies, JSON logs
      - key: RUN_MIGRATIONS
        value: "true"        # the container applies database migrations before starting
      - key: STORAGE_BUCKET
        value: product-images
      # Link prefixes the mobile app may be sent back to after Google sign-in. exp:// is ONLY for
      # testing in Expo Go and must be removed before a real build is published (ADR 0013).
      - key: MOBILE_REDIRECT_PREFIXES
        value: "isabella://,exp://"
      # --- generated by Render ----------------------------------------------------------
      - key: SESSION_SECRET
        generateValue: true  # signs login tokens; a NEW value, never the one used locally
      # --- secrets and addresses you provide in the dashboard ---------------------------
      - key: DATABASE_URL
        sync: false          # Supabase "Session pooler" connection string
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OWNER_EMAILS
        sync: false          # comma-separated Google emails that become store owners
      - key: BACKEND_URL
        sync: false          # the PUBLIC address Google sends users back to (see the walk-through)
      - key: FRONTEND_URL
        sync: false          # where the website lives (users land here after signing in)
      - key: CORS_ORIGINS
        sync: false
